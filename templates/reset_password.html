<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | SkillSphere</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            background: #f5f7fb;
        }

        .reset-page {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
        }

        .reset-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .reset-card h1 {
            text-align: center;
            color: #172033;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #667085;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #344054;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .email-display {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 22px;
            color: #475467;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .reset-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🌐 SkillSphere
        </div>

        <div>
            <a href="/login">Student Login</a>
            <a href="/mentor_login">Mentor Login</a>
        </div>

    </nav>


    <main class="reset-page">

        <div class="reset-card">

            <div class="reset-icon">
                🔑
            </div>

            <h1>
                Create New Password
            </h1>

            <p class="description">
                Enter a new password for your SkillSphere student account.
            </p>


            <div class="email-display">
                📧 Account: <strong>{{ email }}</strong>
            </div>


            <form method="POST">

                <div class="form-group">

                    <label for="password">
                        🔒 New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm_password">
                        🔒 Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                >
                    🔐 Reset Password
                </button>

            </form>


            <a
                href="/login"
                class="back-link"
            >
                ← Back to Student Login
            </a>

        </div>

    </main>

</body>
</html>
